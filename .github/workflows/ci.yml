name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests (includes the fa/en strings parity check)
        run: gradle testDebugUnitTest --stacktrace
      - name: Debug build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  # Release builds run only on version tags. Signing material comes from repository
  # secrets (never committed): MENCH_KEYSTORE_B64, MENCH_KEYSTORE_PASSWORD,
  # MENCH_KEY_ALIAS, MENCH_KEY_PASSWORD; mapped below to the MENCH_RELEASE_* env vars Gradle reads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, android]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode keystore
        run: echo "${{ secrets.MENCH_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/mench.jks"
      - name: Build signed release
        env:
          MENCH_RELEASE_STORE_FILE: ${{ runner.temp }}/mench.jks
          MENCH_RELEASE_STORE_PASSWORD: ${{ secrets.MENCH_KEYSTORE_PASSWORD }}
          MENCH_RELEASE_KEY_ALIAS: ${{ secrets.MENCH_KEY_ALIAS }}
          MENCH_RELEASE_KEY_PASSWORD: ${{ secrets.MENCH_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
