name: Lint (non-blocking)

on:
  workflow_dispatch:
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod a+x ktlint
          ./ktlint "android/app/src/**/*.kt" || true
      - name: detekt
        run: |
          curl -sSLo detekt.zip https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          unzip -q detekt.zip
          ./detekt-cli-1.23.7/bin/detekt-cli --input android/app/src/main --config android/config/detekt.yml || true
